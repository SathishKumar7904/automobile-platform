spring.application.name=enquiry-service
server.port=${APP_PORT:8083}
spring.jackson.time-zone=UTC
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:automobile}?currentSchema=enquiry&options=-c%20TimeZone=UTC
spring.datasource.username=${DB_USERNAME:automobile_app}
spring.datasource.password=${DB_PASSWORD:automobile_app_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=enquiry
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=enquiry
spring.flyway.create-schemas=true
app.services.customer-base-url=${CUSTOMER_SERVICE_URL:http://localhost:8080}
app.services.vehicle-base-url=${VEHICLE_SERVICE_URL:http://localhost:8081}
app.services.dealer-base-url=${DEALER_SERVICE_URL:http://localhost:8082}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

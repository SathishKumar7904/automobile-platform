spring.application.name=dealer-service

server.port=${APP_PORT:8082}

spring.jackson.time-zone=UTC

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:automobile}?currentSchema=dealer&options=-c%20TimeZone=UTC
spring.datasource.username=${DB_USERNAME:automobile_app}
spring.datasource.password=${DB_PASSWORD:automobile_app_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=dealer

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=dealer
spring.flyway.create-schemas=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
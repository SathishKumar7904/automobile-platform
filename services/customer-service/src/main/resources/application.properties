
# ============================================
# Automobile Digital Platform
# Customer Service - Default Configuration
# ============================================

spring.application.name=customer-service

# ---------- Server ----------

server.port=${APP_PORT:8080}

# ---------- Timezone ----------

# Force JSON/application timezone to UTC
spring.jackson.time-zone=UTC

# ---------- PostgreSQL ----------

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:automobile}?options=-c%20TimeZone=UTC
spring.datasource.username=${DB_USERNAME:automobile_app}
spring.datasource.password=${DB_PASSWORD:automobile_app_password}

# ---------- JPA / Hibernate ----------

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------- Flyway ----------

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- Kafka ----------

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# ---------- Actuator / Health ----------

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized